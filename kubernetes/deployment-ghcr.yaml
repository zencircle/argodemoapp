apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world2
  namespace: pekko
spec:
  selector:
    matchLabels:
      app: hello-world2
  replicas: 1
  template:
    metadata:
      labels:
        app: hello-world2
    spec:
      containers:
      - name: hello-world2
        image: ghcr.io/cfpb-internal/regtech-argocd-lab:pr-12
        ports:
        - containerPort: 5000
      imagePullSecrets:
      - name: ghcr-regcred